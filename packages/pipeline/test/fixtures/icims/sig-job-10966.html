>Visa sponsorship for work authorization is not available for this position now or in the future<\/li>\n<\/ul>\n<p>&nbsp;<\/p>\n<p><strong>What\u2019s In It For You<\/strong><\/p>\n<ul>\n <li>Our non-hierarchical culture allows employees of every level to thrive and make impact. We are not your typical trading firm \u2013 the environment is casual, collaborative and we focus on continuous development.<\/li>\n <li>In addition to providing hands-on experience through daily tasks and project work, the program will introduce you to Susquehanna's formal education program through classroom training sessions focused on developing company specific knowledge and technical skills to facilitate process optimization. Topics may include options theory, game theory, decision science, programming (VBA, SQL, Python) and overviews of our trading desks and other areas of our business.<\/li>\n <li>Opportunity to network with coworkers across the firm and build relationships with recently graduated mentors<\/li>\n <li>Housing provided for duration of internship<\/li>\n <li>Relaxed dress code: jeans and sneakers are the norm, shorts all summer long<\/li>\n <li>Fully stocked kitchens for breakfast, lunch, snacks, and beverages<\/li>\n <li>A forty thousand square-foot state of the art fitness facility with brand-new equipment, multi-purpose courts, group exercise classes, and locker room spaces<\/li>\n <li>Discounts for dining, entertainment, shopping, travel, and attractions<\/li>\n <li>Social events including a poker tournament, dinners, and sporting events in Philadelphia<\/li>\n <li>On-site Wellness Center<\/li>\n <li>On-site services such as a mailroom, barber, dry cleaning, and car maintenance<\/li>\n <li>Opportunities to give back to the community through Susquehanna sponsored events and donation drives<\/li>\n<\/ul>\n<p>&nbsp;<\/p>\n<p><strong>About<\/strong> <strong>Susquehanna<\/strong><\/p>\n<p>Susquehanna is a global quantitative trading firm powered by scientific rigor, curiosity, and innovation. Our culture is intellectually driven and highly collaborative, bringing together researchers, engineers, and traders to design and deploy impactful strategies in our systematic trading environment. To meet the unique challenges of global markets, Susquehanna applies machine learning and advanced quantitative research to vast datasets in order to uncover actionable insights and build effective strategies. By uniting deep market expertise with cutting-edge technology, we excel in solving complex problems and pushing boundaries together.<\/p>\n<p>&nbsp;<\/p>\n<p>&nbsp;<\/p>\n<p>If you're a recruiting agency and want to partner with us, please reach out to recruiting@sig.com. Any resume or referral submitted in the absence of a signed agreement will not be eligible for an agency fee.<\/p>\n<p>&nbsp;<\/p>\n<p>#LI-Onsite <\/p>","directApply":true,"datePosted":"2026-06-29T04:00:00.000Z","title":"Accounting Internship: Summer 2027","occupationalCategory":"Interns + Co-ops","@context":"http://schema.org","url":"https://careers-sig.icims.com/jobs/10966/accounting-internship%3a-summer-2027/job"}</script>
