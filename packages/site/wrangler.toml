# Cloudflare Pages (Direct Upload) project settings for local use (`npx wrangler pages project create`,
# `npx wrangler pages deploy` run from this directory). The workflows run wrangler from the repo root
# and pass the output directory and project name explicitly, so they do not read this file.
name = "walkpath"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
