# Hourly crawl (plan sections 4.4 and 8.1). Two crawl jobs poll the registry in parallel,
# diff against a SQLite state file kept in the Actions cache, and upload a diff artifact.
#
# publish job: added in the next feature. It `needs: [crawl-api, crawl-workday]`, downloads
# the `diff-api` and `diff-workday` artifacts, and is the only job with `contents: write`.
name: crawl

on:
  schedule:
    - cron: '17 * * * *' # off-the-hour minute is less contended (plan 4.4)
  workflow_dispatch:
    inputs:
      mode:
        description: 'normal | backfill (re-fetch every job) | regate (publish-only, re-run gates)'
        type: choice
        default: normal
        options: [normal, backfill, regate]
      ats:
        description: 'Comma-separated API sources to poll'
        type: string
        default: greenhouse,lever,ashby,workable,smartrecruiters

permissions:
  contents: read

concurrency:
  group: crawl
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  crawl-api:
    # Scheduled runs only ever execute from main; dispatches are allowed from any branch for testing.
    if: ${{ github.event_name != 'schedule' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CRAWL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'normal' }}
      CRAWL_ATS: ${{ github.event_name == 'workflow_dispatch' && inputs.ats || 'greenhouse,lever,ashby,workable,smartrecruiters' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore crawl state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/state-api.sqlite
          key: state-api-${{ github.run_id }}
          restore-keys: |
            state-api-
      - name: Crawl API-backed boards
        if: ${{ env.CRAWL_MODE != 'regate' }}
        env:
          SMARTRECRUITERS_API_KEY: ${{ secrets.SMARTRECRUITERS_API_KEY }}
        run: >
          node packages/pipeline/scripts/crawl.ts
          --ats "$CRAWL_ATS"
          --mode "${CRAWL_MODE}"
          --boards registry/boards.csv
          --sources registry/sources.json
          --state state/state-api.sqlite
          --out out/diff-api.json
          --concurrency 40
          --deadline-min 25
      - name: Upload diff artifact
        if: ${{ env.CRAWL_MODE != 'regate' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diff-api
          path: out/diff-api.json
          retention-days: 1
          if-no-files-found: error
      - name: Save crawl state
        if: ${{ always() && env.CRAWL_MODE != 'regate' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/state-api.sqlite
          key: state-api-${{ github.run_id }}

  crawl-workday:
    # Off until the Workday adapter lands and the week-1 tolerance test passes (plan 12.3 #2).
    if: ${{ vars.WORKDAY_ENABLED == 'true' && (github.event_name != 'schedule' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CRAWL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'normal' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore crawl state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/state-workday.sqlite
          key: state-workday-${{ github.run_id }}
          restore-keys: |
            state-workday-
      - name: Crawl Workday tenants
        if: ${{ env.CRAWL_MODE != 'regate' }}
        run: >
          node packages/pipeline/scripts/crawl.ts
          --ats workday
          --mode "${CRAWL_MODE}"
          --boards registry/boards.csv
          --sources registry/sources.json
          --state state/state-workday.sqlite
          --out out/diff-workday.json
          --concurrency 20
          --deadline-min 30
      - name: Upload diff artifact
        if: ${{ env.CRAWL_MODE != 'regate' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diff-workday
          path: out/diff-workday.json
          retention-days: 1
          if-no-files-found: error
      - name: Save crawl state
        if: ${{ always() && env.CRAWL_MODE != 'regate' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/state-workday.sqlite
          key: state-workday-${{ github.run_id }}
