# Hourly crawl (plan sections 4.4 and 8.1). Three crawl jobs poll the registry in parallel
# (API sources, Lever on its own because api.lever.co allows one request per second, Workday),
# each diffing against its own SQLite state file kept in the Actions cache and uploading a
# diff artifact.
#
# The publish job needs the crawl jobs, downloads the `diff-api`, `diff-lever` and
# `diff-workday` artifacts, gates and summarizes, commits the data branch, builds the site
# and deploys it. It is the only job with `contents: write`.
name: crawl

on:
  schedule:
    # Two triggers per hour: GitHub delays and sometimes drops scheduled runs (plan 7.3, 12.1).
    # `concurrency: crawl` serialises them and publish is idempotent, so a second trigger in a
    # normal hour only waits and then finds nothing new.
    - cron: '17 * * * *' # off-the-hour minute is less contended (plan 4.4)
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'normal | backfill (re-fetch every job) | regate (publish-only, re-run gates)'
        type: choice
        default: normal
        options: [normal, backfill, regate]
      ats:
        description: 'Comma-separated API sources to poll in the crawl-api job'
        type: string
        default: greenhouse,ashby,workable,smartrecruiters

permissions:
  contents: read

concurrency:
  group: crawl
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  crawl-api:
    # Scheduled runs only ever execute from main; dispatches are allowed from any branch for testing.
    if: ${{ github.event_name != 'schedule' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CRAWL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'normal' }}
      CRAWL_ATS: ${{ github.event_name == 'workflow_dispatch' && inputs.ats || 'greenhouse,ashby,workable,smartrecruiters' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore crawl state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/state-api.sqlite
          key: state-api-${{ github.run_id }}
          restore-keys: |
            state-api-
      - name: Crawl API-backed boards
        if: ${{ env.CRAWL_MODE != 'regate' }}
        env:
          SMARTRECRUITERS_API_KEY: ${{ secrets.SMARTRECRUITERS_API_KEY }}
        run: >
          node packages/pipeline/scripts/crawl.ts
          --ats "$CRAWL_ATS"
          --mode "${CRAWL_MODE}"
          --boards registry/boards.csv
          --sources registry/sources.json
          --state state/state-api.sqlite
          --out out/diff-api.json
          --concurrency 40
          --deadline-min 38
          --grace-min 3
      - name: Upload diff artifact
        # always(): a hard-stopped crawl still writes its artifact; nothing to upload only means
        # the crawl itself failed before writing (publish then skips this source for the hour).
        if: ${{ always() && env.CRAWL_MODE != 'regate' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diff-api
          path: out/diff-api.json
          retention-days: 1
          if-no-files-found: error
      - name: Save crawl state
        if: ${{ always() && env.CRAWL_MODE != 'regate' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/state-api.sqlite
          key: state-api-${{ github.run_id }}

  crawl-lever:
    # Lever on its own: api.lever.co is one host with Crawl-delay 1 (one request per second),
    # so ~2,200 boards plus paging need two hours. Each board is polled every other hour via
    # --shard (UTC hour parity); boards outside the shard are simply not polled, never closed.
    if: ${{ github.event_name != 'schedule' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CRAWL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'normal' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore crawl state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/state-lever.sqlite
          key: state-lever-${{ github.run_id }}
          restore-keys: |
            state-lever-
      - name: Crawl Lever boards (this hour's shard)
        if: ${{ env.CRAWL_MODE != 'regate' }}
        run: >
          node packages/pipeline/scripts/crawl.ts
          --ats lever
          --mode "${CRAWL_MODE}"
          --boards registry/boards.csv
          --sources registry/sources.json
          --state state/state-lever.sqlite
          --out out/diff-lever.json
          --concurrency 4
          --deadline-min 43
          --grace-min 3
          --shard "$((10#$(date -u +%H) % 2))/2"
      - name: Upload diff artifact
        if: ${{ always() && env.CRAWL_MODE != 'regate' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diff-lever
          path: out/diff-lever.json
          retention-days: 1
          if-no-files-found: error
      - name: Save crawl state
        if: ${{ always() && env.CRAWL_MODE != 'regate' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/state-lever.sqlite
          key: state-lever-${{ github.run_id }}

  crawl-extra:
    # Oracle HCM, iCIMS and the SimplifyJobs lists. Oracle and iCIMS are one host per employer
    # with a 1-2 s gap each, so they parallelise widely but must not share a deadline with the
    # big single-host sources. Simplify is two requests for ~7,800 curated listings.
    if: ${{ github.event_name != 'schedule' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CRAWL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'normal' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore crawl state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/state-extra.sqlite
          key: state-extra-${{ github.run_id }}
          restore-keys: |
            state-extra-
      - name: Crawl Oracle, iCIMS and the curated lists
        if: ${{ env.CRAWL_MODE != 'regate' }}
        run: >
          node packages/pipeline/scripts/crawl.ts
          --ats oracle,icims,simplify
          --mode "${CRAWL_MODE}"
          --boards registry/boards.csv
          --sources registry/sources.json
          --state state/state-extra.sqlite
          --out out/diff-extra.json
          --concurrency 24
          --deadline-min 38
          --grace-min 3
      - name: Upload diff artifact
        if: ${{ always() && env.CRAWL_MODE != 'regate' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diff-extra
          path: out/diff-extra.json
          retention-days: 1
          if-no-files-found: error
      - name: Save crawl state
        if: ${{ always() && env.CRAWL_MODE != 'regate' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/state-extra.sqlite
          key: state-extra-${{ github.run_id }}

  crawl-workday:
    # On by default; set the repository variable WORKDAY_ENABLED=false to pause it (plan 12.3 #2:
    # the first live crawl of 240 tenants at 2 s spacing drew no 403s).
    if: ${{ vars.WORKDAY_ENABLED != 'false' && (github.event_name != 'schedule' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CRAWL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'normal' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore crawl state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/state-workday.sqlite
          key: state-workday-${{ github.run_id }}
          restore-keys: |
            state-workday-
      - name: Crawl Workday tenants
        if: ${{ env.CRAWL_MODE != 'regate' }}
        run: >
          node packages/pipeline/scripts/crawl.ts
          --ats workday
          --mode "${CRAWL_MODE}"
          --boards registry/boards.csv
          --sources registry/sources.json
          --state state/state-workday.sqlite
          --out out/diff-workday.json
          --concurrency 20
          --detail-cap 40
          --deadline-min 38
          --grace-min 3
      - name: Upload diff artifact
        if: ${{ always() && env.CRAWL_MODE != 'regate' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diff-workday
          path: out/diff-workday.json
          retention-days: 1
          if-no-files-found: error
      - name: Save crawl state
        if: ${{ always() && env.CRAWL_MODE != 'regate' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/state-workday.sqlite
          key: state-workday-${{ github.run_id }}

  publish:
    # Runs when at least one crawl job succeeded; a missing or failed source's artifact is simply
    # absent and the orchestrator skips it (its closures are withheld), so a broken source can
    # never close jobs. `models: read` lets the built-in GITHUB_TOKEN call GitHub Models for
    # summaries when no provider key is configured.
    needs: [crawl-api, crawl-lever, crawl-extra, crawl-workday]
    if: ${{ always() && (needs.crawl-api.result == 'success' || needs.crawl-lever.result == 'success' || needs.crawl-workday.result == 'success' || needs.crawl-extra.result == 'success') && (github.event_name != 'schedule' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      models: read
    env:
      CRAWL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'normal' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://walkpath.pages.dev' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check whether the data branch exists
        id: data-branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::data branch does not exist yet; see docs/deploy.md (one-time setup)"
          fi
      - name: Checkout the data branch
        if: ${{ steps.data-branch.outputs.exists == 'true' }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: data
          path: data
          fetch-depth: 1
      - name: Prepare an empty data directory
        if: ${{ steps.data-branch.outputs.exists != 'true' }}
        run: mkdir -p data
      - name: Download the API diff artifact
        if: ${{ env.CRAWL_MODE != 'regate' }}
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: diff-api
          path: out/diff-api
      - name: Download the Lever diff artifact
        if: ${{ env.CRAWL_MODE != 'regate' }}
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: diff-lever
          path: out/diff-lever
      - name: Download the Oracle, iCIMS and lists diff artifact
        if: ${{ env.CRAWL_MODE != 'regate' }}
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: diff-extra
          path: out/diff-extra
      - name: Download the Workday diff artifact
        if: ${{ env.CRAWL_MODE != 'regate' }}
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: diff-workday
          path: out/diff-workday
      - name: Restore publish state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/state-publish.sqlite
          key: state-publish-${{ github.run_id }}
          restore-keys: |
            state-publish-
      - name: Publish (gates, summaries, shards, feeds, meta, alerts)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Falls back to the job token: GitHub Models accepts GITHUB_TOKEN from Actions with
          # `models: read` (openai/gpt-4o-mini, roughly 150 requests/day on the low tier).
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN || github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPPRESS_ALERTS: ${{ vars.SUPPRESS_ALERTS }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PUBLISH_MODE: ${{ env.CRAWL_MODE == 'regate' && 'regate' || 'normal' }}
        run: >
          node packages/pipeline/scripts/publish.ts
          --data data
          --artifacts out/diff-api/diff-api.json,out/diff-lever/diff-lever.json,out/diff-extra/diff-extra.json,out/diff-workday/diff-workday.json
          --boards registry/boards.csv
          --sources registry/sources.json
          --state state/state-publish.sqlite
          --site-url "$SITE_URL"
          --deadline-min 12
          --mode "$PUBLISH_MODE"
      - name: Save publish state
        if: ${{ always() }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/state-publish.sqlite
          key: state-publish-${{ github.run_id }}
      - name: Upload meta.json (cron-drift study, plan 12.3 #6)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meta
          path: data/meta.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Stage published data into the site
        run: node packages/pipeline/scripts/stage-site-data.ts --data data --site packages/site --clean
      - name: Build the site
        env:
          PUBLIC_BRANDFETCH_CLIENT_ID: ${{ vars.PUBLIC_BRANDFETCH_CLIENT_ID }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
          PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
        run: npm run build --workspace @walkpath/site
      - name: Detect optional integrations
        id: opt
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEARTBEAT: ${{ secrets.BETTERSTACK_HEARTBEAT_URL }}
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_HOOK" ]; then echo "vercel=true" >> "$GITHUB_OUTPUT"; else echo "vercel=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "cloudflare=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; site built but not deployed"
          fi
          if [ -n "$HEARTBEAT" ]; then echo "heartbeat=true" >> "$GITHUB_OUTPUT"; else echo "heartbeat=false" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy to Cloudflare Pages
        if: ${{ steps.opt.outputs.cloudflare == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'walkpath' }}
        run: >
          npx --no-install wrangler pages deploy packages/site/dist
          --project-name "$PAGES_PROJECT"
          --branch main
          --commit-dirty=true
      - name: Commit the data branch
        # Runs after the deploy so a broken build never advances the data branch ahead of the site.
        if: ${{ steps.data-branch.outputs.exists == 'true' }}
        run: |
          git -C data add -A
          if git -C data -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "chore(data): hourly publish ${{ github.run_id }}"; then
            git -C data push origin HEAD:data
          else
            echo "nothing to commit"
          fi
      - name: Trigger the Vercel rebuild
        # Vercel builds from git and pulls the data branch itself (packages/site/scripts/fetch-data.ts);
        # the hook only asks it to rebuild now that the branch moved.
        if: ${{ steps.opt.outputs.vercel == 'true' && steps.data-branch.outputs.exists == 'true' }}
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl -fsS -m 10 --retry 3 -o /dev/null -X POST "$VERCEL_DEPLOY_HOOK_URL"
      - name: Heartbeat
        if: ${{ success() && steps.opt.outputs.heartbeat == 'true' }}
        env:
          BETTERSTACK_HEARTBEAT_URL: ${{ secrets.BETTERSTACK_HEARTBEAT_URL }}
        run: curl -fsS -m 10 --retry 3 -o /dev/null "$BETTERSTACK_HEARTBEAT_URL"
