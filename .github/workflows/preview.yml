# Staging deploy (plan 8.2): every push to main that touches the site builds it with the
# committed sample data and, when the Cloudflare secrets exist, deploys it to the Pages
# project's `preview` branch so layout changes can be reviewed at the preview URL without
# waiting for the hourly run. Without secrets it only proves the build.
name: preview

on:
  push:
    branches: [main]
    paths:
      - 'packages/site/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://walkpath.pages.dev' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the site with sample data
        env:
          PUBLIC_BRANDFETCH_CLIENT_ID: ${{ vars.PUBLIC_BRANDFETCH_CLIENT_ID }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
          PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
        run: npm run build --workspace @walkpath/site
      - name: Detect Cloudflare credentials
        id: opt
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "cloudflare=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not set; preview built but not deployed"
          fi
      - name: Deploy preview
        if: ${{ steps.opt.outputs.cloudflare == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'walkpath' }}
        run: >
          npx --no-install wrangler pages deploy packages/site/dist
          --project-name "$PAGES_PROJECT"
          --branch preview
          --commit-dirty=true
